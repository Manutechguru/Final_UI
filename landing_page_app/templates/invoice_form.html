<!DOCTYPE html>
<html>
<head>

<style>
/* minimal required styles copied from your real form */

.hidden{display:none!important;}

#clientModal{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
z-index:2000;
}

.modal-box{
background:#fff;
border-radius:12px;
width:65%;
max-height:75%;
overflow-y:auto;
padding:24px;
margin:8% auto;
}

.client-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:16px;
}

.client-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:24px;
margin:20px 0 24px;
}

.client-sub{
color:#6b7280;
font-size:13px;
margin-bottom:12px;
}

.add-client{
margin-top:18px;
padding-top:16px;
border-top:1px solid #e5e7eb;
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.add-client textarea,
.add-client input{
border-radius:10px;
padding:10px;
border:1px solid #e5e7eb;
}

.add-client textarea{
grid-column:1 / -1;
}

.client-actions{
display:flex;
justify-content:flex-end;
gap:12px;
margin-top:10px;
}

.client-actions button{
padding:10px 18px;
border-radius:10px;
border:none;
cursor:pointer;
font-weight:600;
}

.client-actions .save{
background:#2563eb;
color:white;
}

.client-actions .close{
background:#e5e7eb;
}

.client-card{
border:1px solid #e5e7eb;
border-radius:14px;
overflow:hidden;
cursor:pointer;
background:white;
transition:.25s ease;
display:flex;
flex-direction:column;
}

.client-card:hover{
transform:translateY(-4px);
box-shadow:0 16px 40px rgba(0,0,0,.18);
border-color:#2563eb;
}

.client-card img{
width:100%;
height:200px;
object-fit:cover;
}

.client-title{
padding:10px;
text-align:center;
font-weight:600;
font-size:14px;
background:#f9fafb;
}
</style>

</head>

<body>

{% if client_key %}

{% include "invoice_forms/" ~ client_key ~ ".html" %}

{% else %}

<!-- CLIENT PICKER MODAL -->

<div id="clientModal" class="hidden">
<div class="modal-box">

<div class="client-header">
<h3>Pick Client Template</h3>
</div>

<div class="client-sub">
Select an existing client or add a new one
</div>

<div id="clientList" class="client-grid"></div>

<div class="add-client">

<input id="clientName" placeholder="Client Name">

<input type="file" id="bgUpload">

<textarea id="fromAddr" placeholder="From Address"></textarea>
<textarea id="toAddr" placeholder="Buyer (To) Address"></textarea>

</div>

<div class="client-actions">
<button class="close" onclick="closeClient()">Close</button>
<button class="save" onclick="saveClient()">Save Client</button>
</div>

</div>
</div>

<script>

function openClients(){
 fetch("/admin/invoice/clients")
 .then(r=>r.json())
 .then(d=>{
   const box=document.getElementById("clientList");
   box.innerHTML="";

   d.forEach(c=>{
   box.innerHTML+=`
   <div class="client-card"
        data-id="${c.id}"
        data-bg="${c.bg}"
        data-name="${c.name}"
        data-addr="${c.from_address.replace(/"/g,"&quot;")}"
        data-to="${(c.to_address || '').replace(/"/g,"&quot;")}"
        onclick="pickClient(this)">

        <img src="data:image/png;base64,${c.bg}">
        <div class="client-title">${c.name}</div>

    </div>
    `;
    });

   document.getElementById("clientModal").classList.remove("hidden");
 });
}

function closeClient(){
 document.getElementById("clientModal").classList.add("hidden");
}

function pickClient(btn){
 const id = btn.dataset.id;
 if(!id){
   alert("Client ID missing");
   return;
 }
 window.location.href = "/admin/invoice?client_id=" + id;
}

function saveClient(){

 const clientName = document.getElementById("clientName");
 const fromAddr = document.getElementById("fromAddr");
 const bgUpload = document.getElementById("bgUpload");

 if(!clientName.value.trim()){
   alert("Client name required");
   return;
 }

 if(!bgUpload.files.length || !fromAddr.value.trim()){
   alert("Upload background + enter address");
   return;
 }

 const f=new FormData();
 f.append("name", clientName.value.trim());
 f.append("bg_image",bgUpload.files[0]);
 f.append("from_address",fromAddr.value);
 f.append("to_address", document.getElementById("toAddr").value);

 fetch("/admin/invoice/client",{method:"POST",body:f})
 .then(r=>r.json())
 .then(()=>{
   clientName.value="";
   fromAddr.value="";
   document.getElementById("toAddr").value="";
   bgUpload.value="";
   openClients();
 });
}

/* AUTO OPEN ON PAGE LOAD */
window.addEventListener("DOMContentLoaded",()=>{
 openClients();
});

</script>

{% endif %}

</body>
</html>
