<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Edit User</title>

  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/tailwind.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;             /* removes both scrollbars */
    }

/* Ensure internal scrolling works if content ever grows */
    .page {
      min-height: 100vh;
      max-width: 100vw;
      overflow-x: hidden;           /* no horizontal scroll */
      overflow-y: auto;             /* allows scroll only if absolutely needed */
      box-sizing: border-box;
    }
    .page-header {
      background-color: #4f46e5;
      color: #fff;
      padding: 1.2rem 2rem;
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .page-header h1 {
      margin: 0;
      font-size: 1.3rem;
    }

    .back-btn {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      cursor: pointer;
      text-decoration: none;
    }

    .back-btn:hover { background: rgba(255,255,255,0.25); }

    .page-content {
      flex: 1;
      display: flex;
      align-items: center;     /* vertically center */
      justify-content: center; /* horizontally center */
      padding: 2rem;
      overflow: hidden;
      box-sizing: border-box;
    }


    .edit-card {
      background: #ffffff;
      width: 100%;
      max-width: 750px;
      border-radius: 1rem;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      padding: 2rem 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #374151;
      margin-bottom: 0.3rem;
      display: block;
    }

    input, select {
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      padding: 0.7rem 0.9rem;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, select:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
    }

    .form-row { display: flex; flex-direction: column; gap: 0.4rem; }

    .password-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin-top: 0.6rem;
    }

    .password-actions label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 500;
      font-size: 0.9rem;
      margin: 0;
    }

    .checkbox-inline {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .password-info {
      font-size: 0.8rem;
      color: #6b7280;
    }

    /* --- Refined bottom block --- */
    .footer-block {
      background: #f3f4f6;
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      margin-top: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .footer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-top label {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.8rem;
    }

    .btn {
      padding: 0.7rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      cursor: pointer;
      text-align: center;
    }

    .btn-blue { background: #4f46e5; color: #fff; border: none; }
    .btn-blue:hover { background: #4338ca; }

    .btn-outline {
      background: #fff;
      color: #1e293b;
      border: 1px solid #d1d5db;
    }
    .btn-outline:hover { background: #f3f4f6; }

    .btn-gen {
      background: #f8fafc;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-gen:hover {
      border-color: #4f46e5;
      color: #4f46e5;
      background: #eef2ff;
    }

    .fade-in { animation: fadeIn 0.35s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ------------------ NEW refined password icon layout fix ------------------ */
    .input-with-icon {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
  box-sizing: border-box;
}

.input-with-icon input {
  flex: 1;
  width: 100%;
  padding-right: 2.8rem; /* space for icon inside */
  height: 2.8rem;       /* same height as other inputs */
}

/* ---------- eye icon (view password) ---------- */
.view-pass-btn {
  position: absolute;
  right: 0.6rem;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  outline: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 1.75rem;
  width: 1.75rem;
  padding: 0;
}

.view-pass-btn svg {
  width: 1.2rem;
  height: 1.2rem;
  stroke: #6b7280; /* subtle gray icon */
  stroke-width: 1.8;
  fill: none;
  transition: stroke 0.2s ease;
}

.view-pass-btn:hover svg,
.view-pass-btn:focus svg {
  stroke: #4f46e5;
}

.view-pass-btn:focus {
  box-shadow: 0 0 0 2px rgba(79,70,229,0.15);
  border-radius: 0.25rem;
}   

  </style>
</head>

<body>
  <div class="page fade-in">
    <header class="page-header">
      <h1>Edit User</h1>
      <a href="/admin?tab=allusers" class="back-btn">← Back to All Users</a>
    </header>

    <main class="page-content">
      <div class="edit-card">
        <form method="post" action="/admin/users/{{ user.id }}/edit">

          <div class="form-row">
            <label>Full Name</label>
            <input name="full_name" value="{{ user.full_name }}">
          </div>

          <div class="form-row">
            <label>Email</label>
            <input name="email" value="{{ user.email }}">
          </div>

          <div class="form-row">
            <label>New Password (optional)</label>

            <!-- New password input wrapped with icon -->
            <div class="input-with-icon">
              <input id="admin_new_password" name="new_password" type="password"
                     placeholder="Enter new password (leave blank to keep current)">
              <button type="button" class="view-pass-btn" data-target="admin_new_password" aria-label="Show new password" title="Show / hide password">
                <!-- Eye (open) icon by default -->
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>

            <!-- Confirm password input wrapped with icon -->
            <div style="height:0.6rem;"></div> <!-- small spacer to separate inputs visually -->

            <div class="input-with-icon">
              <input id="admin_confirm_password" name="confirm_password" type="password"
                     placeholder="Confirm new password">
              <button type="button" class="view-pass-btn" data-target="admin_confirm_password" aria-label="Show confirm password" title="Show / hide password">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>

            <div class="password-actions">
              <button type="button" id="gen-pass" class="btn-gen">Generate temporary password</button>
              <label class="checkbox-inline">
                <input id="force-reset" name="force_password_change" type="checkbox">
                Force password change on next login
              </label>
            </div>

            <p class="password-info">
              Passwords are stored securely. You can set a new one here, or generate a temporary password and ask the user to change it at their next login.
            </p>
          </div>

          <!-- 🔹 Clean grouped footer block -->
          <div class="footer-block">
            <div class="footer-top">
              <label class="checkbox-inline">
                <input type="checkbox" name="is_active" {% if user.is_active %}checked{% endif %}>
                Active
              </label>
              <div>
                <label>Role</label>
                <select name="role">
                  {% for r in roles %}
                    <option value="{{ r }}" {% if user.role and user.role.name==r %}selected{% endif %}>{{ r }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <div class="actions">
              <button class="btn btn-blue">Save</button>
              <a class="btn btn-outline" href="/admin?tab=allusers">Cancel</a>
            </div>
          </div>

        </form>
      </div>
    </main>
  </div>

  <script>
    function randPassword(len = 12) {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()-_=+";
      let out = "";
      for (let i = 0; i < len; i++) out += chars.charAt(Math.floor(Math.random()*chars.length));
      return out;
    }
    const btn = document.getElementById('gen-pass');
    if (btn) {
      btn.addEventListener('click', () => {
        const p = randPassword(12);
        document.getElementById('admin_new_password').value = p;
        document.getElementById('admin_confirm_password').value = p;
        alert('Temporary password (copy and share securely):\\n\\n' + p);
      });
    }

    /* ------------------ NEW: password view toggle logic ------------------ */
    (function() {
      // toggles an input between password and text and swaps icon (open/closed eye)
      function makeEyeSvg(open) {
        if (open) {
          // eye-open (same as default, but returned for explicitness)
          return '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
        } else {
          // eye-off: simplified crossed eye
          return '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-6 0-10-7-10-7 .9-1.5 2.1-2.9 3.6-4.1"/><path d="M1 1l22 22"/><path d="M9.88 9.88a3 3 0 0 0 4.24 4.24"/></svg>';
        }
      }

      function toggleHandler(e) {
        const btn = e.currentTarget;
        const targetId = btn.getAttribute('data-target');
        if (!targetId) return;
        const input = document.getElementById(targetId);
        if (!input) return;

        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';

        // swap icon - use simple eye / eye-off svg to indicate state
        if (isPassword) {
          // now showing text -> show "eye-off" to indicate click will hide
          btn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
        } else {
          // now hidden -> show open-eye (keeps same appearance but toggles semantics)
          btn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
        }

        // keep focus on the input for convenience
        input.focus();
      }

      // attach listeners to all view-pass-btn
      const viewBtns = document.querySelectorAll('.view-pass-btn');
      viewBtns.forEach(b => {
        b.addEventListener('click', toggleHandler);
        // ensure initial svg is set (in case older browsers alter innerHTML)
        // leave as-is; already set inline in HTML
      });
    })();
  </script>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/vendor.js"></script>
</body>
</html>
