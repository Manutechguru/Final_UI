<!DOCTYPE html>
<html>
<body>

<!-- MAIN LAYOUT -->
{% include "layouts/" ~ layout_key ~ ".html" %}

<!-- ACTIONS -->
<div class="actions">

<form method="post" action="/admin/invoice">
<input type="hidden" name="session_id" value="{{ session_id }}">
<input type="hidden" name="client_bg" value="{{ bg_image }}">
<input type="hidden" name="layout_key" value="{{ layout_key }}">

{% if data.signature_blob %}
<input type="hidden" name="signature_blob" value="{{ data.signature_blob }}">
{% endif %}

{% for k, v in data.items() %}
<input type="hidden" name="{{ k }}" value="{{ v }}">
{% endfor %}

<button type="submit">Edit</button>
</form>

<form method="post" action="/admin/invoice/export">
<input type="hidden" name="session_id" value="{{ session_id }}">
<input type="hidden" name="client_bg" value="{{ bg_image }}">
<input type="hidden" name="layout_key" value="{{ layout_key }}">

{% if data.signature_blob %}
<input type="hidden" name="signature_blob" value="{{ data.signature_blob }}">
{% endif %}

{% for k, v in data.items() %}
<input type="hidden" name="{{ k }}" value="{{ v }}">
{% endfor %}

<button type="submit">Export as PDF</button>
</form>

</div>

</body>
</html>
