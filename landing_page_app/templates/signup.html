<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Teetli</title>
  <link rel="stylesheet" href="/static/css/signup.css">
</head>
<body>
  <div class="container">
    <!-- Left branding -->
    <div class="left-panel">
      <h1 class="brand-title">Welcome to Teetli</h1>
      <p class="brand-subtitle">Your secure gateway to success</p>
    </div>

    <!-- Right signup form -->
    <div class="right-panel">
      <div class="signup-container">
        <h2>Create Account</h2>
        <p class="welcome-text">Join us today! Please fill in your details.</p>
        
        <!-- Success message (hidden by default) -->
        <div id="successMessage" class="success-message hidden">
           Your signup has been recorded. Please wait for admin approval
        </div>

        <form method="post" action="/signup" class="signup-form" id="signupForm">
          <div class="input-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" placeholder="Enter your full name" required>
          </div>

          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" placeholder="Enter your password" required>
              <button type="button" class="password-toggle" id="passwordToggle">
                <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" 
                  viewBox="0 0 24 24" fill="none" stroke="currentColor" 
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <div class="strength-bar">
              <div class="strength-fill" id="strengthFill"></div>
            </div>
          </div>

          <button type="submit" class="btn">Create Account</button>
        </form>

        <p class="login-text">
          Already have an account? <a href="/login">Login here</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/static/js/signup.js"></script>
</body>
</html>
